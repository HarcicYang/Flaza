[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flaza"
version = "0.1.0"
description = "基于 lagrange-python 与 Neony 的 QQ 桌面客户端"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "HarcicYang" },
]
keywords = ["qq", "lagrange", "neony", "desktop", "client"]
dependencies = [
    "aiosqlite>=0.20",
    "lagrange-python @ git+https://github.com/HarcicYang/lagrange-python.git",
    "msgpack>=1.1",
    "neony>=0.2.0.post1",
]

[project.scripts]
flaza = "flaza.app:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["flaza*"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
# 项目文档、注释和界面文案统一使用简体中文，全角标点不是歧义字符。
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.1",
    "pyrefly>=1.2.0",
]
